<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Soundboard">
<title>Soundboard</title>
<style>
/* ===== Värit ja mitat: muokkaa näitä vapaasti ===== */
:root {
  --pohja: #07080f;
  --lasi: rgba(255,255,255,.06);
  --lasi-reuna: rgba(255,255,255,.11);
  --teksti: #f4f5fb;
  --himmea: rgba(244,245,251,.45);
  --stop1: #ff3b5c;
  --stop2: #ff7a45;
  --rako: 16px;
  --pad-leveys: 170px;
  --pad-korkeus: 130px;
  --pyoristys: 22px;
  --palkki-leveys: 60px;
  --ylapalkki: 108px;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--pohja);
  color: var(--teksti);
  font-family: -apple-system, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ================= TAUSTA: revontulet ja pistekuvio ================= */
#aurora {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  overflow: hidden; pointer-events: none; z-index: 0;
  opacity: .7;
}
.valo { position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%; will-change: transform; }
.v1 { top: -30vmax; left: -15vmax; background: radial-gradient(circle, rgba(127,90,240,.55) 0%, rgba(127,90,240,0) 62%); animation: aur1 19s ease-in-out infinite alternate; }
.v2 { top: -20vmax; right: -30vmax; background: radial-gradient(circle, rgba(44,177,255,.45) 0%, rgba(44,177,255,0) 62%); animation: aur2 23s ease-in-out infinite alternate; }
.v3 { bottom: -40vmax; left: 10vmax; background: radial-gradient(circle, rgba(255,77,141,.35) 0%, rgba(255,77,141,0) 62%); animation: aur3 27s ease-in-out infinite alternate; }
@keyframes aur1 { to { transform: translate(35vw, 20vh) scale(1.2); } }
@keyframes aur2 { to { transform: translate(-40vw, 30vh) scale(.85); } }
@keyframes aur3 { to { transform: translate(25vw, -25vh) scale(1.3); } }
#dots {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 0;
  background-image: radial-gradient(rgba(255,255,255,.09) 1px, rgba(255,255,255,0) 1.5px);
  background-size: 26px 26px;
}

/* Valopurkaus painalluskohdasta. Piirretään pienenä ja skaalataan, jotta muisti riittää. */
#bloom {
  position: fixed; top: 0; left: 0;
  width: 50vmax; height: 50vmax;
  margin: -25vmax 0 0 -25vmax;
  border-radius: 50%;
  pointer-events: none; z-index: 6;
  opacity: 0;
  will-change: transform, opacity;
}
#bloom.isku { animation: bloom .8s cubic-bezier(.1,.7,.3,1) forwards; }
@keyframes bloom {
  0% { opacity: .9; transform: scale(.15); }
  100% { opacity: 0; transform: scale(3.2); }
}

/* Kineettinen jättiteksti: nousee esiin maskin takaa */
#splash {
  position: fixed; top: 50%; left: 0; width: 100%;
  height: 14vw; margin-top: -7vw;
  overflow: hidden;
  pointer-events: none; z-index: 7;
  text-align: center;
}
#splashIn {
  display: inline-block;
  padding: 0 4vw;
  font-size: 12vw; line-height: 14vw;
  font-weight: 800;
  letter-spacing: -.045em;
  white-space: nowrap;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  transform: translateY(110%);
}
#splash.nayta #splashIn { animation: nousu 1.05s cubic-bezier(.7,0,.2,1) forwards; }
@keyframes nousu {
  0% { transform: translateY(110%) skewY(6deg); }
  28% { transform: translateY(0) skewY(0); }
  72% { transform: translateY(0) skewY(0); }
  100% { transform: translateY(-110%) skewY(-6deg); }
}
#splash.nayta { animation: kasva 1.05s cubic-bezier(.2,.6,.3,1) forwards; }
@keyframes kasva { from { transform: scale(.94); } to { transform: scale(1.06); } }

/* ================= YLÄPALKKI ================= */
#top {
  position: fixed;
  top: calc(12px + env(safe-area-inset-top, 0px));
  left: var(--rako); right: 8px;
  height: var(--ylapalkki);
  display: flex;
  z-index: 3;
}
#stop {
  position: relative;
  flex: 0 0 auto;
  width: 34%;
  min-width: 220px;
  margin-right: var(--rako);
  padding: 0;
  border: 0;
  border-radius: var(--pyoristys);
  overflow: hidden;
  background: linear-gradient(135deg, var(--stop1), var(--stop2));
  box-shadow: 0 18px 50px -14px var(--stop1), inset 0 1px 0 rgba(255,255,255,.35);
  color: #fff;
  font-family: inherit;
  transition: transform .12s cubic-bezier(.3,1.5,.5,1);
}
#stop .sisalto {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px; font-weight: 800;
  letter-spacing: .02em;
}
#stop .ikoni {
  width: 30px; height: 30px;
  margin-right: 16px;
  border-radius: 7px;
  background: #fff;
}
/* kiiltopyyhkäisy */
#stop::before {
  content: '';
  position: absolute; top: 0; bottom: 0; left: 0;
  width: 45%;
  background: linear-gradient(100deg, rgba(255,255,255,0), rgba(255,255,255,.35), rgba(255,255,255,0));
  transform: translateX(-120%);
  animation: kiilto 4.5s ease-in-out infinite;
}
@keyframes kiilto {
  0%, 70% { transform: translateX(-120%); }
  100% { transform: translateX(340%); }
}
#stop:active, #stop.isku { transform: scale(.95); }

#now {
  position: relative;
  flex: 1;
  min-width: 0;
  padding: 14px 22px 0;
  border-radius: var(--pyoristys);
  background: var(--lasi);
  box-shadow: inset 0 0 0 1px var(--lasi-reuna);
  -webkit-backdrop-filter: blur(22px) saturate(160%);
  backdrop-filter: blur(22px) saturate(160%);
  overflow: hidden;
}
.otsake {
  display: block;
  font-size: 11px; font-weight: 700;
  letter-spacing: .16em;
  color: var(--himmea);
}
#nowName {
  display: block;
  margin: 2px 150px 0 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 28px; line-height: 36px;
  font-weight: 800;
  letter-spacing: -.02em;
  color: rgba(244,245,251,.3);
}
#now.soi #nowName {
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: nimiSisaan .45s cubic-bezier(.2,.9,.3,1);
}
@keyframes nimiSisaan { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

#scoreBox { position: absolute; top: 14px; right: 22px; text-align: right; }
#score {
  display: block;
  font-size: 26px; line-height: 36px;
  font-weight: 800;
  letter-spacing: -.01em;
  font-variant-numeric: tabular-nums;
  color: var(--teksti);
}
#score.pop { animation: scorepop .35s cubic-bezier(.3,1.6,.5,1); }
@keyframes scorepop { 0% { transform: translateY(-6px) scale(1.15); opacity: .4; } 100% { transform: none; opacity: 1; } }

/* Taajuusanalysaattori */
#spec {
  position: absolute;
  left: 22px; right: 22px; bottom: 10px;
  height: 26px;
  display: flex;
  align-items: flex-end;
}
#spec i {
  flex: 1;
  height: 100%;
  margin: 0 1.5px;
  border-radius: 2px;
  background: linear-gradient(0deg, #7f5af0, #2cb1ff 60%, #00f5a0);
  transform-origin: 50% 100%;
  transform: scaleY(.06);
  opacity: .85;
}

/* ================= RUUDUKKO ================= */
#stage {
  position: absolute;
  top: calc(var(--ylapalkki) + 14px + env(safe-area-inset-top, 0px));
  bottom: 0; left: 0;
  right: calc(var(--palkki-leveys) + 16px);
  z-index: 1;
}
#board {
  position: absolute;
  top: 0; right: 0; bottom: 0; left: 0;
  padding: calc(var(--rako) + 4px) var(--rako);
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(var(--pad-leveys), 1fr));
  grid-auto-rows: var(--pad-korkeus);
  grid-gap: var(--rako);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.pad {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px 12px 20px;
  border-radius: var(--pyoristys);
  text-align: center;
  word-break: break-word;
  line-height: 1.15;
  cursor: pointer;
}

.pad.taysi {
  --c1: #7f5af0;
  --c2: #2cb1ff;
  background: linear-gradient(160deg, rgba(255,255,255,.085), rgba(255,255,255,.02));
  box-shadow: inset 0 0 0 1px var(--lasi-reuna), 0 10px 30px -18px #000;
  color: var(--teksti);
  font-size: 21px;
  font-weight: 700;
  letter-spacing: -.01em;
  transition: transform .18s cubic-bezier(.3,1.5,.5,1), box-shadow .25s, opacity .25s;
}
/* värillinen hehkulinja alareunassa */
.pad.taysi::before {
  content: '';
  position: absolute;
  left: 22px; right: 22px; bottom: 0;
  height: 3px;
  border-radius: 3px;
  background: linear-gradient(90deg, var(--c1), var(--c2));
  box-shadow: 0 0 14px var(--c1);
  z-index: 1;
}
/* laajeneva rengas */
.pad.taysi::after {
  content: '';
  position: absolute;
  top: -2px; left: -2px; right: -2px; bottom: -2px;
  border: 2px solid var(--c2);
  border-radius: calc(var(--pyoristys) + 2px);
  opacity: 0;
  pointer-events: none;
}
/* täyttökerros: liukuväri, aalto ja kiilto */
.fill {
  position: absolute;
  top: 0; right: 0; bottom: 0; left: 0;
  border-radius: inherit;
  overflow: hidden;
  background: linear-gradient(135deg, var(--c1), var(--c2));
  opacity: 0;
  transition: opacity .3s;
}
.fill::before {
  content: '';
  position: absolute; top: 0; bottom: 0; left: 0;
  width: 60%;
  background: linear-gradient(100deg, rgba(255,255,255,0), rgba(255,255,255,.45), rgba(255,255,255,0));
  transform: translateX(-120%);
}
.aalto {
  position: absolute;
  border-radius: 50%;
  background: rgba(255,255,255,.45);
  transform: scale(0);
  animation: aalto .65s cubic-bezier(.1,.6,.3,1) forwards;
  pointer-events: none;
}
@keyframes aalto { to { transform: scale(1); opacity: 0; } }

.nimi { position: relative; z-index: 2; display: block; will-change: transform; }

.pad.soi {
  transform: scale(.965);
  box-shadow: 0 22px 60px -14px var(--c1), 0 0 0 2px rgba(255,255,255,.9);
  z-index: 2;
}
.pad.soi::before { opacity: 0; }
.pad.soi .fill { opacity: 1; transition: opacity .05s; }
.pad.soi .fill::before { animation: pyyhkaisy .7s cubic-bezier(.4,0,.2,1); }
@keyframes pyyhkaisy { from { transform: translateX(-120%); } to { transform: translateX(260%); } }
.pad.soi .nimi { text-shadow: 0 2px 12px rgba(0,0,0,.35); animation: nosto .5s cubic-bezier(.2,1.6,.4,1); }
@keyframes nosto { from { transform: scale(1.25); } to { transform: scale(1); } }
.pad.soi::after, .pad.vilkku::after { animation: rengas .7s cubic-bezier(.1,.7,.3,1); }
@keyframes rengas {
  0% { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: scale(1.3); }
}
.pad.vilkku .fill { opacity: .35; }

body.soi .pad.taysi:not(.soi) { opacity: .45; }

.prog {
  position: absolute;
  left: 0; bottom: 0;
  width: 100%; height: 5px;
  background: rgba(255,255,255,.9);
  transform-origin: 0 50%;
  transform: scaleX(0);
}
.pad.soi .prog { animation-name: etene; animation-timing-function: linear; animation-fill-mode: forwards; }
@keyframes etene { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.pad.lataa { opacity: .3; }

.pad.tyhja {
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
  background: rgba(255,255,255,.015);
  color: rgba(244,245,251,.28);
  font-size: 15px;
  font-weight: 600;
}

/* ================= MUOKKAUSTILA ================= */
.tools { display: none; }
body.editing .tools {
  display: flex;
  position: absolute;
  left: 8px; right: 8px; bottom: 10px;
  justify-content: space-between;
  z-index: 3;
}
.tool {
  width: 42px; height: 34px;
  border: 0;
  border-radius: 12px;
  background: rgba(255,255,255,.12);
  color: #fff;
  font-size: 15px;
}
.tool.poista { background: rgba(255,59,92,.85); }
body.editing .pad.taysi { box-shadow: inset 0 0 0 1px rgba(255,255,255,.3); }

#fileInput { display: none; }

/* ================= VIERITYS JA MUOKKAUSNAPPI ================= */
#bar {
  position: fixed;
  top: calc(var(--ylapalkki) + 30px + env(safe-area-inset-top, 0px));
  right: 8px;
  bottom: calc(70px + env(safe-area-inset-bottom, 0px));
  width: var(--palkki-leveys);
  border-radius: 18px;
  background: rgba(255,255,255,.035);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.07);
  z-index: 2;
}
#bar.piilossa { display: none; }
#thumb {
  position: absolute;
  left: 7px; right: 7px; top: 0;
  min-height: 60px;
  border-radius: 13px;
  background: linear-gradient(180deg, #7f5af0, #2cb1ff);
  box-shadow: 0 8px 26px -6px rgba(44,177,255,.7), inset 0 1px 0 rgba(255,255,255,.4);
}
#editBtn {
  position: fixed;
  right: 8px;
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  width: var(--palkki-leveys);
  height: 48px;
  border: 0;
  border-radius: 16px;
  background: rgba(255,255,255,.06);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.1);
  color: var(--himmea);
  font-family: inherit;
  font-size: 17px;
  z-index: 2;
}
body.editing #editBtn { background: #fff; color: var(--pohja); font-size: 13px; font-weight: 700; }

/* Kevyt tila */
body.kevyt #aurora, body.kevyt #splash, body.kevyt #bloom { display: none; }
body.kevyt #now { -webkit-backdrop-filter: none; backdrop-filter: none; background: #12131d; }
body.kevyt #stop::before { animation: none; }

@media (prefers-reduced-motion: reduce) {
  .valo, #stop::before, #bloom.isku, #splash.nayta, #splash.nayta #splashIn,
  .pad.soi::after, .pad.vilkku::after, .pad.soi .nimi, .pad.soi .fill::before, .aalto, #score.pop { animation: none; }
}
</style>
</head>
<body>
<div id="aurora"><div class="valo v1"></div><div class="valo v2"></div><div class="valo v3"></div></div>
<div id="dots"></div>
<div id="top">
  <button id="stop" type="button"><span class="sisalto"><span class="ikoni"></span>STOP</span></button>
  <div id="now">
    <span class="otsake">NYT SOI</span>
    <span id="nowName">Hiljaista</span>
    <div id="scoreBox"><span class="otsake">PISTEET</span><span id="score">000000</span></div>
    <div id="spec"></div>
  </div>
</div>
<div id="stage"><div id="board"></div></div>
<div id="bar"><div id="thumb"></div></div>
<button id="editBtn" type="button">✎</button>
<input id="fileInput" type="file" accept="audio/mpeg,.mp3,audio/*" multiple>
<div id="bloom"></div>
<div id="splash"><span id="splashIn"></span></div>

<script>
(function () {
  'use strict';

  var PAIKKOJA = 100;
  // Jos iPad nykii: vaihda true. Revontulet, lasisumennus, valopurkaus ja jättiteksti jäävät pois.
  var KEVYT = false;
  // Houkuttelutila: kun mitään ei ole painettu näin moneen sekuntiin,
  // painikkeet välähtelevät hiljaa. 0 = pois päältä.
  var HOUKUTTELU_SEK = 20;
  // Liukuväriparit painikkeille
  var PARIT = [
    ['#7f5af0', '#2cb1ff'], ['#ff4d8d', '#ff9a3c'], ['#00d98b', '#00c2f5'],
    ['#f72585', '#7209b7'], ['#ffc53d', '#ff5e62'], ['#4cc9f0', '#4361ee'],
    ['#a3e635', '#10b981'], ['#c084fc', '#f472b6']
  ];
  var PALKKEJA = 32;

  if (KEVYT) document.body.classList.add('kevyt');

  /* ---------- Ääni: yksi sample kerrallaan ---------- */
  var AC = window.AudioContext || window.webkitAudioContext;
  var ctx = new AC();
  var master = ctx.createGain();
  var analyser = ctx.createAnalyser();
  analyser.fftSize = 512;
  analyser.smoothingTimeConstant = 0.72;
  master.connect(analyser);
  analyser.connect(ctx.destination);
  var wave = new Uint8Array(analyser.fftSize);
  var freq = new Uint8Array(analyser.frequencyBinCount);

  var buffers = {};
  var current = null;

  function unlock() {
    if (ctx.state === 'running') return;
    if (ctx.resume) ctx.resume();
    var s = ctx.createBufferSource();
    s.buffer = ctx.createBuffer(1, 1, 22050);
    s.connect(ctx.destination);
    s.start(0);
  }
  document.addEventListener('touchend', unlock);

  function decode(arrayBuffer) {
    return new Promise(function (res, rej) {
      ctx.decodeAudioData(arrayBuffer.slice(0), res, function (e) { rej(e || new Error('decode')); });
    });
  }

  function stopCurrent() {
    if (!current) return;
    var c = current;
    current = null;
    c.src.onended = null;
    var t = ctx.currentTime;
    try {
      c.gain.gain.cancelScheduledValues(t);
      c.gain.gain.setValueAtTime(1, t);
      c.gain.gain.linearRampToValueAtTime(0, t + 0.015);
      c.src.stop(t + 0.02);
    } catch (e) {}
    lightOff(c.id);
    showNow(null);
  }

  function play(p, x, y) {
    var b = buffers[p.id];
    if (!b) return;
    stopCurrent();
    var src = ctx.createBufferSource();
    var g = ctx.createGain();
    src.buffer = b;
    src.connect(g);
    g.connect(master);
    src.start(0);
    current = { src: src, gain: g, id: p.id };
    src.onended = function () {
      if (current && current.src === src) {
        current = null;
        lightOff(p.id);
        showNow(null);
      }
    };
    lightUp(p, b.duration, x, y);
    addScore();
    startMeter();
  }

  /* ---------- Analysaattori ja äänen tahdissa hehkuvat asiat ---------- */
  var aurora = document.getElementById('aurora');
  var spec = document.getElementById('spec');
  var bars = [];
  for (var bi = 0; bi < PALKKEJA; bi++) {
    var bar_i = document.createElement('i');
    spec.appendChild(bar_i);
    bars.push(bar_i);
  }
  var level = 0, meterOn = false;

  function startMeter() {
    if (meterOn) return;
    meterOn = true;
    requestAnimationFrame(tick);
  }
  function tick() {
    var peak = 0, i;
    if (current) {
      analyser.getByteTimeDomainData(wave);
      for (i = 0; i < wave.length; i += 2) {
        var v = Math.abs(wave[i] - 128);
        if (v > peak) peak = v;
      }
      peak = Math.min(1, peak / 110);
      analyser.getByteFrequencyData(freq);
    }
    level = Math.max(peak, level * 0.86);
    for (i = 0; i < PALKKEJA; i++) {
      // logaritminen jako: bassoille enemmän palkkeja kuin diskantille
      var bin = 1 + Math.floor(Math.pow(i / PALKKEJA, 1.9) * 150);
      var val = current ? freq[bin] / 255 : 0;
      bars[i].style.transform = 'scaleY(' + Math.max(0.06, val).toFixed(3) + ')';
    }
    if (!KEVYT) aurora.style.opacity = (0.7 + level * 0.3).toFixed(3);
    if (current && els[current.id]) {
      var n = els[current.id].querySelector('.nimi');
      if (n && !n.style.animationName) n.style.transform = 'scale(' + (1 + level * 0.12).toFixed(3) + ')';
    }
    if (current || level > 0.01) requestAnimationFrame(tick);
    else {
      meterOn = false; level = 0;
      aurora.style.opacity = '';
      for (i = 0; i < PALKKEJA; i++) bars[i].style.transform = 'scaleY(.06)';
    }
  }

  /* ---------- Visuaalit ---------- */
  var bloom = document.getElementById('bloom');
  var splash = document.getElementById('splash');
  var splashIn = document.getElementById('splashIn');
  var now = document.getElementById('now');
  var nowName = document.getElementById('nowName');
  var top = document.getElementById('top');

  function restart(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  function hash(str) {
    var h = 0;
    for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
    return Math.abs(h);
  }
  function colors(id) { return PARIT[hash(id) % PARIT.length]; }
  function grad(c, deg) { return 'linear-gradient(' + deg + 'deg,' + c[0] + ',' + c[1] + ')'; }

  function burst(x, y, color) {
    if (KEVYT) return;
    bloom.style.left = x + 'px';
    bloom.style.top = y + 'px';
    bloom.style.background = 'radial-gradient(circle,' + color + 'bb 0%,' + color + '00 62%)';
    restart(bloom, 'isku');
  }

  function bigText(text, c) {
    if (KEVYT) return;
    splashIn.textContent = text;
    splashIn.style.backgroundImage = grad(c, 90);
    restart(splash, 'nayta');
  }

  function lightUp(p, dur, x, y) {
    var c = colors(p.id);
    var el = els[p.id];
    if (el) {
      var r = el.getBoundingClientRect();
      if (x === undefined) { x = r.left + r.width / 2; y = r.top + r.height / 2; }
      var fill = el.querySelector('.fill');
      var prog = el.querySelector('.prog');
      prog.style.webkitAnimationDuration = dur + 's';
      prog.style.animationDuration = dur + 's';
      var n = el.querySelector('.nimi');
      n.style.transform = '';
      restart(el, 'soi');
      n.style.animationName = 'nosto';
      setTimeout(function () { n.style.animationName = ''; }, 500);

      // aalto kosketuskohdasta
      var size = Math.max(r.width, r.height) * 2.2;
      var a = document.createElement('span');
      a.className = 'aalto';
      a.style.width = a.style.height = size + 'px';
      a.style.left = (x - r.left - size / 2) + 'px';
      a.style.top = (y - r.top - size / 2) + 'px';
      fill.appendChild(a);
      setTimeout(function () { if (a.parentNode) a.parentNode.removeChild(a); }, 700);
    }
    document.body.classList.add('soi');
    if (x !== undefined) burst(x, y, c[0]);
    bigText(p.name, c);
    showNow(p);
  }

  function lightOff(id) {
    var el = els[id];
    if (el) {
      el.classList.remove('soi');
      var n = el.querySelector('.nimi');
      if (n) n.style.transform = '';
    }
    document.body.classList.remove('soi');
  }

  function showNow(p) {
    if (p) {
      nowName.textContent = p.name;
      nowName.style.backgroundImage = grad(colors(p.id), 90);
      restart(now, 'soi');
    } else {
      now.classList.remove('soi');
      nowName.textContent = 'Hiljaista';
      nowName.style.backgroundImage = '';
    }
  }

  /* ---------- Pisteet ---------- */
  var score = 0;
  var scoreEl = document.getElementById('score');
  function addScore() {
    score += 100;
    var s = String(score);
    while (s.length < 6) s = '0' + s;
    scoreEl.textContent = s;
    restart(scoreEl, 'pop');
  }

  /* ---------- STOP ---------- */
  var REKT = ['GET REKT', 'REKT', 'GG EZ', 'NOPE', 'WASTED'];
  var stopBtn = document.getElementById('stop');
  var stopTouched = false;
  function hitStop(x, y) {
    var wasPlaying = !!current;
    stopCurrent();
    restart(stopBtn, 'isku');
    setTimeout(function () { stopBtn.classList.remove('isku'); }, 150);
    if (x === undefined) {
      var r = stopBtn.getBoundingClientRect();
      x = r.left + r.width / 2; y = r.top + r.height / 2;
    }
    burst(x, y, '#ff3b5c');
    if (wasPlaying) bigText(REKT[Math.floor(Math.random() * REKT.length)], ['#ff3b5c', '#ff7a45']);
  }
  stopBtn.addEventListener('touchstart', function (e) {
    stopTouched = true; e.preventDefault();
    hitStop(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: false });
  stopBtn.addEventListener('click', function (e) { if (!stopTouched) hitStop(e.clientX, e.clientY); });

  /* ---------- Houkuttelutila ---------- */
  var lastTouch = Date.now();
  function touched() { lastTouch = Date.now(); }
  document.addEventListener('touchstart', touched, true);
  document.addEventListener('mousedown', touched, true);
  if (HOUKUTTELU_SEK > 0 && !KEVYT) {
    setInterval(function () {
      if (editing || current || Date.now() - lastTouch < HOUKUTTELU_SEK * 1000) return;
      var ids = Object.keys(els);
      if (!ids.length) return;
      var el = els[ids[Math.floor(Math.random() * ids.length)]];
      restart(el, 'vilkku');
      setTimeout(function () { el.classList.remove('vilkku'); }, 700);
    }, 900);
  }

  /* ---------- Tallennus (IndexedDB) ---------- */
  var db;
  function openDB() {
    return new Promise(function (res, rej) {
      var r = indexedDB.open('soundboard', 1);
      r.onupgradeneeded = function () {
        r.result.createObjectStore('meta', { keyPath: 'id' });
        r.result.createObjectStore('audio', { keyPath: 'id' });
      };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }
  function req(store, mode, fn) {
    return new Promise(function (res, rej) {
      var r = fn(db.transaction(store, mode).objectStore(store));
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }
  function allMeta() {
    return new Promise(function (res, rej) {
      var out = [];
      var r = db.transaction('meta', 'readonly').objectStore('meta').openCursor();
      r.onsuccess = function () {
        var c = r.result;
        if (c) { out.push(c.value); c['continue'](); } else res(out);
      };
      r.onerror = function () { rej(r.error); };
    });
  }
  function saveMeta(p) {
    return req('meta', 'readwrite', function (s) { return s.put({ id: p.id, name: p.name, order: p.order }); });
  }

  /* ---------- Tila ja näkymä ---------- */
  var slots = [];
  for (var k = 0; k < PAIKKOJA; k++) slots.push(null);
  var els = {};
  var editing = false;
  var targetSlot = 0;
  var board = document.getElementById('board');
  var editBtn = document.getElementById('editBtn');
  var fileInput = document.getElementById('fileInput');

  function tool(text, cls, fn) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'tool ' + cls;
    b.textContent = text;
    b.addEventListener('click', function (e) { e.stopPropagation(); fn(); });
    return b;
  }

  function bindPad(el, p) {
    var usedTouch = false, waiting = false, tx, ty;
    el.addEventListener('touchstart', function (e) {
      usedTouch = true;
      if (editing) return;
      e.preventDefault();
      tx = e.touches[0].clientX; ty = e.touches[0].clientY;
      if (ctx.state === 'running') play(p, tx, ty); else waiting = true;
    }, { passive: false });
    el.addEventListener('touchend', function (e) {
      if (editing) return;
      e.preventDefault();
      unlock();
      if (waiting) { waiting = false; play(p, tx, ty); }
    }, { passive: false });
    el.addEventListener('click', function (e) {
      if (editing) { rename(p); return; }
      if (usedTouch) return;
      unlock();
      play(p, e.clientX, e.clientY);
    });
  }

  function render() {
    var scroll = board.scrollTop;
    board.innerHTML = '';
    els = {};
    slots.forEach(function (p, i) {
      var el;
      if (p) {
        var c = colors(p.id);
        el = document.createElement('div');
        el.className = 'pad taysi' + (buffers[p.id] ? '' : ' lataa');
        el.style.setProperty('--c1', c[0]);
        el.style.setProperty('--c2', c[1]);

        var fill = document.createElement('div');
        fill.className = 'fill';
        var prog = document.createElement('div');
        prog.className = 'prog';
        fill.appendChild(prog);
        el.appendChild(fill);

        var label = document.createElement('span');
        label.className = 'nimi';
        label.textContent = p.name;
        el.appendChild(label);

        var tools = document.createElement('div');
        tools.className = 'tools';
        tools.appendChild(tool('◀', 'siirra', function () { move(i, -1); }));
        tools.appendChild(tool('✕', 'poista', function () { remove(p); }));
        tools.appendChild(tool('▶', 'siirra', function () { move(i, 1); }));
        el.appendChild(tools);

        bindPad(el, p);
        els[p.id] = el;
      } else {
        el = document.createElement('label');
        el.className = 'pad tyhja';
        el.htmlFor = 'fileInput';
        el.textContent = '+ Lisää sample';
        el.addEventListener('click', function () { targetSlot = i; });
      }
      board.appendChild(el);
    });
    board.scrollTop = scroll;
    updateBar();
  }

  /* ---------- Muokkaus ---------- */
  function readFile(file) {
    return new Promise(function (res, rej) {
      var fr = new FileReader();
      fr.onload = function () { res(fr.result); };
      fr.onerror = function () { rej(fr.error); };
      fr.readAsArrayBuffer(file);
    });
  }

  function freeSlotFrom(start) {
    for (var n = 0; n < PAIKKOJA; n++) {
      var i = (start + n) % PAIKKOJA;
      if (!slots[i]) return i;
    }
    return -1;
  }

  fileInput.addEventListener('change', function () {
    var files = Array.prototype.slice.call(fileInput.files);
    fileInput.value = '';
    var chain = Promise.resolve();
    files.forEach(function (file) {
      chain = chain.then(function () {
        var slot = freeSlotFrom(targetSlot);
        if (slot < 0) { alert('Kaikki ' + PAIKKOJA + ' paikkaa ovat täynnä.'); return; }
        return readFile(file).then(function (data) {
          return decode(data).then(function (buf) {
            var p = {
              id: Date.now() + '-' + Math.floor(Math.random() * 1e6),
              name: file.name.replace(/\.[^.]+$/, ''),
              order: slot
            };
            return req('audio', 'readwrite', function (s) { return s.put({ id: p.id, data: data }); })
              .then(function () { return saveMeta(p); })
              .then(function () {
                buffers[p.id] = buf;
                slots[slot] = p;
                targetSlot = slot + 1;
                render();
              });
          });
        })['catch'](function () {
          alert('Tiedostoa "' + file.name + '" ei voitu lukea. Tarkista, että se on mp3.');
        });
      });
    });
  });

  function rename(p) {
    var n = prompt('Painikkeen nimi', p.name);
    if (n === null) return;
    n = n.trim();
    if (!n) return;
    p.name = n;
    saveMeta(p);
    render();
  }

  function remove(p) {
    if (!confirm('Poistetaanko "' + p.name + '"?')) return;
    if (current && current.id === p.id) stopCurrent();
    req('meta', 'readwrite', function (s) { return s['delete'](p.id); });
    req('audio', 'readwrite', function (s) { return s['delete'](p.id); });
    delete buffers[p.id];
    slots[p.order] = null;
    render();
  }

  function move(i, d) {
    var j = i + d;
    if (j < 0 || j >= PAIKKOJA) return;
    var t = slots[i]; slots[i] = slots[j]; slots[j] = t;
    if (slots[i]) { slots[i].order = i; saveMeta(slots[i]); }
    if (slots[j]) { slots[j].order = j; saveMeta(slots[j]); }
    render();
  }

  editBtn.addEventListener('click', function () {
    editing = !editing;
    document.body.classList[editing ? 'add' : 'remove']('editing');
    editBtn.textContent = editing ? 'Valmis' : '✎';
  });

  /* ---------- Iso vierityspalkki ---------- */
  var bar = document.getElementById('bar');
  var thumb = document.getElementById('thumb');

  function updateBar() {
    var sh = board.scrollHeight, ch = board.clientHeight;
    if (sh <= ch + 1) { bar.className = 'piilossa'; return; }
    bar.className = '';
    var trackH = bar.clientHeight;
    var th = Math.max(60, trackH * ch / sh);
    thumb.style.height = th + 'px';
    thumb.style.top = ((trackH - th) * board.scrollTop / (sh - ch)) + 'px';
  }

  function seek(clientY) {
    var r = bar.getBoundingClientRect();
    var th = thumb.offsetHeight;
    var ratio = (clientY - r.top - th / 2) / (r.height - th);
    ratio = Math.max(0, Math.min(1, ratio));
    board.scrollTop = ratio * (board.scrollHeight - board.clientHeight);
    updateBar();
  }

  bar.addEventListener('touchstart', function (e) { e.preventDefault(); seek(e.touches[0].clientY); }, { passive: false });
  bar.addEventListener('touchmove', function (e) { e.preventDefault(); seek(e.touches[0].clientY); }, { passive: false });
  var dragging = false;
  bar.addEventListener('mousedown', function (e) { dragging = true; seek(e.clientY); e.preventDefault(); });
  document.addEventListener('mousemove', function (e) { if (dragging) seek(e.clientY); });
  document.addEventListener('mouseup', function () { dragging = false; });

  board.addEventListener('scroll', updateBar);
  window.addEventListener('resize', updateBar);
  window.addEventListener('orientationchange', function () { setTimeout(updateBar, 300); });

  /* ---------- Käynnistys ---------- */
  openDB().then(function (d) {
    db = d;
    return allMeta();
  }).then(function (list) {
    list.sort(function (a, b) { return a.order - b.order; });
    list.forEach(function (p) {
      var i = p.order;
      if (!(i >= 0 && i < PAIKKOJA) || slots[i]) {
        i = freeSlotFrom(0);
        if (i < 0) return;
        p.order = i;
        saveMeta(p);
      }
      slots[i] = p;
    });
    render();
    var chain = Promise.resolve();
    slots.forEach(function (p) {
      if (!p) return;
      chain = chain.then(function () {
        return req('audio', 'readonly', function (s) { return s.get(p.id); })
          .then(function (rec) { return rec ? decode(rec.data) : null; })
          .then(function (buf) {
            if (buf) { buffers[p.id] = buf; if (els[p.id]) els[p.id].classList.remove('lataa'); }
          })['catch'](function () {});
      });
    });
  })['catch'](function () {
    render();
    alert('Tallennustilaa ei saatu auki. Avaa sivu osoitteesta (https://...), ei tiedostona.');
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')['catch'](function () {});
  }
})();
</script>
</body>
</html>
